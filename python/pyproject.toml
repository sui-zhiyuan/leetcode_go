[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetcode-python"
version = "0.1.0"
description = "LeetCode solutions in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# 测试只装 pytest；ruff 与 mypy 分开，避免为了 lint 触发 mypy 的额外依赖构建。
[dependency-groups]
dev = ["pytest>=8.0"]
lint = ["ruff>=0.9"]
typecheck = ["mypy>=1.14,<2"]

# 国内直连 PyPI 较慢，默认使用清华镜像。
# 如需切回官方源，删除下面这段，或运行时设置 UV_DEFAULT_INDEX=https://pypi.org/simple。
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/leetcode"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["leetcode"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
